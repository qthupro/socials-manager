<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <g transform="translate(0 40)">
  <!-- Hub & spokes: one place managing many accounts -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="44" stroke-linecap="round">
    <line x1="512" y1="540" x2="512" y2="282"/>
    <line x1="512" y1="540" x2="735" y2="669"/>
    <line x1="512" y1="540" x2="289" y2="669"/>
  </g>

  <g fill="#ffffff">
    <circle cx="512" cy="540" r="118"/>
    <circle cx="512" cy="262" r="82"/>
    <circle cx="752" cy="679" r="82"/>
    <circle cx="272" cy="679" r="82"/>
  </g>

  <!-- Hollow center gives the hub some depth -->
  <circle cx="512" cy="540" r="52" fill="#f97316"/>
  </g>
</svg>
